hat)</text><rect x="345" y="666" width="360.0" height="18" rx="4" fill="#eb6834"/><text x="715.0" y="680" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#0b0b0b" text-anchor="start" >12/20</text><text x="48" y="734" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="start" >One reply per model, 20 fixed inputs. “Differed” = the model predicted something other than the local program printed (output kind, or θ/φ for clear cases).</text><text x="48" y="756" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="start" >This is not accuracy and not a ranking, and it does not say which side was right.</text><rect x="760" y="774" width="14" height="14" rx="3" fill="#2a78d6"/><text x="782" y="786" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="start" >all 20 matched</text><rect x="900" y="774" width="14" height="14" rx="3" fill="#eb6834"/><text x="922" y="786" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="start" >some differed</text></svg>